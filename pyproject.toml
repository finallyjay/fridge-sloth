[project]
name = "fridge-sloth"
version = "0.1.0"
description = "Snap your fridge, get a grocery list and healthy meals. Runs fully offline on Gemma via Ollama."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [
    { name = "Jose Antonio Granero" },
]
dependencies = []

[project.optional-dependencies]
# Optional Sentry Agent Tracing (see README). Pinned versions live in requirements-sentry.txt.
sentry = ["sentry-sdk>=2.64,<3"]
# Only for generating the demo video's voice-over (scripts/narrate_demo.py).
demo = ["elevenlabs>=2.74,<3", "python-dotenv>=1.2,<2"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=server --cov=tracing --cov-report=term-missing"
