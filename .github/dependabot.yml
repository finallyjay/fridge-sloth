version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid

  - package-ecosystem: github-actions
    directory: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid

  - package-ecosystem: pre-commit
    directory: "/"
    commit-message:
      prefix: "chore"
      include: "scope"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
